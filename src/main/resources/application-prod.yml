spring:
  config:
    activate:
      on-profile: prod

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_SERVER_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5 # master(5개) + slave(5개) 로 최대 db 에는 총 10개 연결
      minimum-idle: 5 # max와 동일하게 맞춰서 불필요한 커넥션 생성/삭제 비용 제거

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database: mysql
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email

jwt:
  secret: ${JWT_SECRET}

token:
  access:
    storage-key-prefix: "accessToken:"
    expire-time: 2h
  refresh:
    storage-key-prefix: "refreshToken:"
    expire-time: 14d

app:
  cookie:
    secure: true

management:
  endpoints:
    web:
      exposure:
        include: "metrics"
